<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark Planet Technologies</title>
<meta name="description" content="Senior infrastructure leadership, on demand: cloud operations, security, FinOps, and AI enablement.">
<link rel="canonical" href="https://darkplanettechnologies.com/">
<meta property="og:type" content="website">
<meta property="og:title" content="Dark Planet Technologies">
<meta property="og:description" content="Senior infrastructure leadership, on demand: cloud operations, security, FinOps, and AI enablement.">
<meta property="og:url" content="https://darkplanettechnologies.com/">
<style>
  :root {
    --bg: #fbfbfa;
    --ink: #15171c;
    --muted: #5b6270;
    --rule: #e3e4e6;
    --link: #15171c;
    --accent: #3b4a6b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1015;
      --ink: #e9eaee;
      --muted: #9aa1ad;
      --rule: #262a33;
      --link: #e9eaee;
      --accent: #8fa3cf;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 18px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    padding: 18vh 24px 64px;
  }
  .name {
    margin: 0 0 20px;
    font-size: clamp(2rem, 6vw, 2.75rem);
    line-height: 1.15;
    font-weight: 650;
    letter-spacing: -0.02em;
  }
  .line {
    margin: 0 0 40px;
    font-size: clamp(1.1rem, 3vw, 1.3rem);
    color: var(--muted);
    max-width: 34em;
  }
  .rule { border: 0; border-top: 1px solid var(--rule); margin: 0 0 28px; }
  dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 10px 24px; }
  dt { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; padding-top: 3px; }
  dd { margin: 0; }
  a { color: var(--link); text-decoration-color: var(--accent); text-underline-offset: 3px; }
  a:hover { color: var(--accent); }
  footer {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    padding: 24px;
    color: var(--muted);
    font-size: 0.85rem;
  }
  @media (max-width: 480px) {
    main { padding-top: 12vh; }
    dl { grid-template-columns: 1fr; gap: 2px; }
    dd { margin-bottom: 14px; }
  }
</style>
</head>
<body>
<main>
  <h1 class="name">Dark Planet Technologies</h1>
  <p class="line">Senior infrastructure leadership, on demand: cloud operations, security, FinOps, and AI enablement.</p>
  <hr class="rule">
  <dl>
    <dt>Contact</dt>
    <dd><a href="mailto:hello@darkplanettechnologies.com">hello@darkplanettechnologies.com</a></dd>
    <dt>Writing</dt>
    <dd><a href="https://mikeontechnology.com/?utm_source=darkplanet&amp;utm_medium=referral">Mike on Technology</a></dd>
    <dt>Elsewhere</dt>
    <dd><a href="https://bsky.app/profile/darkplanettechnologies.com">Bluesky</a> · <a href="https://x.com/darkplanettech">X</a></dd>
  </dl>
</main>
<footer>© 2026 Dark Planet Technologies LLC · California</footer>
</body>
</html>
