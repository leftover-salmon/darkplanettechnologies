<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* The logo is a night-side scene, so the page lives in it: always dark. */
  :root {
    --space: #060607;
    --light: #e6e4df;
    --muted: #8d8b87;
    --rule: #1f1f22;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--space); }
  body {
    margin: 0;
    background: var(--space);
    color: var(--light);
    font: 18px/1.6 "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  /* The horizon runs off both sides at every width; past 1600px the image
     stops growing and its own background blends into the page. */
  .sky { overflow: hidden; }
  .horizon {
    display: block;
    width: max(100%, 640px);
    max-width: 1600px;
    height: auto;
    margin: 0 auto;
    position: relative;
    left: 50%;
    transform: translateX(-50%);
    /* The terrain runs off the bottom of the drawing; fade it into the night. */
    -webkit-mask-image: linear-gradient(#000 60%, transparent);
    mask-image: linear-gradient(#000 60%, transparent);
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    padding: 0 24px 64px;
  }
  .name {
    margin: -96px 0 16px;
    position: relative;
    font-size: clamp(2rem, 6vw, 2.75rem);
    line-height: 1.15;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .line {
    margin: 0 0 40px;
    font-size: clamp(1.1rem, 3vw, 1.3rem);
    color: var(--muted);
    max-width: 34em;
  }
  .rule { border: 0; border-top: 1px solid var(--rule); margin: 0 0 28px; }
  dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 10px 24px; }
  dt { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; padding-top: 3px; }
  dd { margin: 0; }
  a { color: var(--light); text-decoration-color: #55534f; text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--light); }
  footer {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    padding: 24px;
    color: var(--muted);
    font-size: 0.85rem;
  }
  @media (max-width: 720px) {
    .name { margin-top: -24px; }
  }
  @media (max-width: 480px) {
    dl { grid-template-columns: 1fr; gap: 2px; }
    dd { margin-bottom: 14px; }
  }
</style>
</head>
<body>
<div class="sky"><img class="horizon" src="horizon.svg" width="300" height="100" alt=""></div>
<main>
  <h1 class="name">Dark Planet Technologies</h1>
  <p class="line">Senior infrastructure leadership, on demand: Cloud Operations, Security, FinOps, and AI Enablement.</p>
  <hr class="rule">
  <dl>
    <dt>Contact</dt>
    <dd><a href="mailto:hello@darkplanettechnologies.com">hello@darkplanettechnologies.com</a></dd>
    <dt>Writing</dt>
    <dd><a href="https://mikeontechnology.com/?utm_source=darkplanet&amp;utm_medium=referral">Mike on Technology</a></dd>
    <dt>Elsewhere</dt>
    <dd><a href="https://bsky.app/profile/darkplanettechnologies.com">Bluesky</a> · <a href="https://x.com/darkplanettech">X</a></dd>
  </dl>
</main>
<footer>© 2026 Dark Planet Technologies LLC · California</footer>
</body>
</html>
