<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" role="img" aria-label="Dark Planet Technologies"><title>Dark Planet Technologies</title><defs>
    <filter id="widet" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
